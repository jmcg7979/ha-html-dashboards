<!doctype html>
<!-- Built-in home screen for when the dashboard can't load (HA down, not set up yet): every installed app and a Settings
     button. Self-contained, no network. The app checks HA every 20 s and returns to the dashboard once it answers. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --ink: #0d1017; --text: #eee9e1; --text-2: #adb3c0; --veil: rgba(255,255,255,.08); --lamp: 242,179,94; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font: 15px/1.3 system-ui, sans-serif; overflow: hidden; }
  main { padding: 32px 48px; height: 100%; display: flex; flex-direction: column; gap: 20px; }
  header { display: flex; align-items: baseline; gap: 16px; }
  #clock { font-size: 40px; font-weight: 600; }
  #why { color: var(--text-2); flex: 1; }
  #grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; overflow: auto; padding: 6px; }
  button { all: unset; display: block; border-radius: 10px; background: var(--veil); outline: 3px solid transparent; outline-offset: 3px;
    transition: transform .12s, outline-color .12s; }
  button:focus { outline-color: rgb(var(--lamp)); transform: scale(1.06); }
  .app img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; border-radius: 10px; }
  .app span { display: none; }
  .app.noimg span { display: flex; aspect-ratio: 16 / 9; align-items: center; justify-content: center; padding: 8px; text-align: center; }
  .app.noimg img { display: none; }
  #settings { padding: 10px 18px; }
</style>
</head>
<body>
<main>
  <header><div id="clock"></div><div id="why"></div><button id="settings">Settings</button></header>
  <div id="grid"></div>
</main>
<script>
  var host = window.tvhost, info = {};
  try { info = JSON.parse(host.info()); } catch (e) {}
  var origin = (info.url || '').replace(/^(https?:\/\/[^/]+).*$/, '$1') || 'http://tv.invalid';
  document.getElementById('why').textContent = decodeURIComponent(location.hash.slice(1)) + (info.url ? ' · trying again' : '');
  function clock() { var d = new Date(); document.getElementById('clock').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  clock(); setInterval(clock, 10000);

  var apps = []; try { apps = JSON.parse(host.apps()); } catch (e) {}
  apps.sort(function (a, b) { return a.label.localeCompare(b.label); });
  var grid = document.getElementById('grid');
  apps.forEach(function (a) {
    var b = document.createElement('button'); b.className = 'app';
    b.innerHTML = '<img alt=""><span></span>';
    b.querySelector('span').textContent = a.label;
    var img = b.querySelector('img'); img.onerror = function () { b.classList.add('noimg'); };
    img.src = origin + '/__tv/banner/' + encodeURIComponent(a.pkg);
    b.onclick = function () { host.launch(a.pkg); };
    grid.appendChild(b);
  });
  document.getElementById('settings').onclick = function () { host.settings(); };

  // D-pad: move to the nearest button in the arrow's direction
  var DIR = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  addEventListener('keydown', function (e) {
    var d = DIR[e.key]; if (!d) return; e.preventDefault();
    var all = [].slice.call(document.querySelectorAll('button')), cur = document.activeElement;
    if (all.indexOf(cur) < 0) { (all[1] || all[0]).focus(); return; }
    var r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, best = null, bd = 1e9;
    all.forEach(function (b) {
      if (b === cur) return;
      var q = b.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
      var along = dx * d[0] + dy * d[1], across = Math.abs(dx * d[1] - dy * d[0]);
      if (along <= 1) return;
      var score = along + across * 2; if (score < bd) { bd = score; best = b; }
    });
    if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }); }
  });
  (grid.firstChild || document.getElementById('settings')).focus();
  addEventListener('tv:home', function () { (grid.firstChild || document.getElementById('settings')).focus(); });

</script>
</body>
</html>
