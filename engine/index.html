<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Home</title>
<link rel="preload" href="assets/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<script>
// DO NOT CHANGE THIS FILE (or start.html). Browsers keep it for up to 31 days (HA's cache for /local), so it must never
// need to change: it only reads version.json fresh and loads boot.js?v=<version>, which does the real work.
fetch('version.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return { v: String(Date.now()) }; })
  .then(function (j) { window.DASH_MANIFEST = j; var s = document.createElement('script'); s.src = 'boot.js?v=' + (j.v || Date.now()); document.head.appendChild(s); });
</script>
</head>
<body>
<div class="shell"><nav id="rail"></nav><main id="app"></main></div>
<div id="perf" hidden><i></i><span>connecting…</span></div>
<div id="login" hidden><div style="font-size:22px;font-weight:600">Sign in to Home Assistant</div><button id="loginBtn">Sign in</button></div>
</body>
</html>
